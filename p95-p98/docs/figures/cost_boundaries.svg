   <g id="text_1">
    <text style="fill: #18313f; font: 700 15px 'DejaVu Sans'; text-anchor: start" x="72.7776" y="200.548856" transform="rotate(-0 72.7776 200.548856)">1  Discover the programs</text>
   </g>
   <g id="text_2">
    <text style="fill: #18313f; font: 13px 'DejaVu Sans'; text-anchor: start" x="72.7776" y="246.203569" transform="rotate(-0 72.7776 246.203569)">Once, before deployment</text>
   </g>
   <g id="text_3">
    <text style="fill: #18313f; font: 13px 'DejaVu Sans'; text-anchor: start" x="72.7776" y="280.405009" transform="rotate(-0 72.7776 280.405009)">380.437 route-CPU hours</text>
   </g>
   <g id="text_4">
    <text style="fill: #18313f; font: 13px 'DejaVu Sans'; text-anchor: start" x="72.7776" y="314.606449" transform="rotate(-0 72.7776 314.606449)">21,531,286 recorded LLM tokens</text>
   </g>
   <g id="text_5">
    <text style="fill: #18313f; font: 13px 'DejaVu Sans'; text-anchor: start" x="72.7776" y="348.807889" transform="rotate(-0 72.7776 348.807889)">P96 tokens missing; 0 paid API calls</text>
   </g>
   <g id="text_6">
    <text style="fill: #18313f; font: 13px 'DejaVu Sans'; text-anchor: start" x="72.7776" y="383.009329" transform="rotate(-0 72.7776 383.009329)">LLM waiting and money not reconciled</text>
   </g>
   <g id="text_7">
    <text style="fill: #18313f; font: 700 15px 'DejaVu Sans'; text-anchor: start" x="560.2464" y="200.548856" transform="rotate(-0 560.2464 200.548856)">2  Build the fragment library</text>
   </g>
   <g id="text_8">
    <text style="fill: #18313f; font: 13px 'DejaVu Sans'; text-anchor: start" x="560.2464" y="246.203569" transform="rotate(-0 560.2464 246.203569)">Once per protected input set</text>
   </g>
   <g id="text_9">
    <text style="fill: #18313f; font: 13px 'DejaVu Sans'; text-anchor: start" x="560.2464" y="280.405009" transform="rotate(-0 560.2464 280.405009)">CASP15: 148.44 CPU seconds</text>
   </g>
   <g id="text_10">
    <text style="fill: #18313f; font: 13px 'DejaVu Sans'; text-anchor: start" x="560.2464" y="314.606449" transform="rotate(-0 560.2464 314.606449)">Public 1L2Y example: 29.36 CPU seconds</text>
   </g>
   <g id="text_11">
    <text style="fill: #18313f; font: 13px 'DejaVu Sans'; text-anchor: start" x="560.2464" y="348.807889" transform="rotate(-0 560.2464 348.807889)">BENCH48 build cost not reconciled</text>
   </g>
   <g id="text_12">
    <text style="fill: #096daa; font: 700 15px 'DejaVu Sans'; text-anchor: start" x="72.7776" y="477.698456" transform="rotate(-0 72.7776 477.698456)">3  Run a program on an input</text>
   </g>
   <g id="text_13">
    <text style="fill: #18313f; font: 12.7px 'DejaVu Sans'; text-anchor: start" x="72.7776" y="523.125216" transform="rotate(-0 72.7776 523.125216)">Used in program-vs-NGK comparisons</text>
   </g>
   <g id="text_14">
    <text style="fill: #18313f; font: 12.7px 'DejaVu Sans'; text-anchor: start" x="72.7776" y="557.326656" transform="rotate(-0 72.7776 557.326656)">BENCH48 logical work: 16.11% / 25.13%</text>
   </g>
   <g id="text_15">
    <text style="fill: #18313f; font: 12.7px 'DejaVu Sans'; text-anchor: start" x="72.7776" y="591.528096" transform="rotate(-0 72.7776 591.528096)">BENCH48 route CPU: 17.84% / 26.66%</text>
   </g>
   <g id="text_16">
    <text style="fill: #18313f; font: 12.7px 'DejaVu Sans'; text-anchor: start" x="72.7776" y="625.729536" transform="rotate(-0 72.7776 625.729536)">Both pairs: P95 / P98, relative to NGK</text>
   </g>
   <g id="text_17">
    <text style="fill: #18313f; font: 12.7px 'DejaVu Sans'; text-anchor: start" x="72.7776" y="659.930976" transform="rotate(-0 72.7776 659.930976)">CASP15 P98: 6.66% / 151.50% CPU</text>
   </g>
   <g id="text_18">
    <text style="fill: #18313f; font: 12.7px 'DejaVu Sans'; text-anchor: start" x="72.7776" y="694.132416" transform="rotate(-0 72.7776 694.132416)">AlphaFold2 / ESMFold starts, vs NGK</text>
   </g>
   <g id="text_19">
    <text style="fill: #18313f; font: 700 15px 'DejaVu Sans'; text-anchor: start" x="560.2464" y="477.698456" transform="rotate(-0 560.2464 477.698456)">4  Check the outputs</text>
   </g>
   <g id="text_20">
    <text style="fill: #18313f; font: 13px 'DejaVu Sans'; text-anchor: start" x="560.2464" y="523.353169" transform="rotate(-0 560.2464 523.353169)">Final structure-quality scoring</text>
   </g>
   <g id="text_21">
    <text style="fill: #18313f; font: 13px 'DejaVu Sans'; text-anchor: start" x="560.2464" y="557.554609" transform="rotate(-0 560.2464 557.554609)">MolProbity where performed</text>
   </g>
   <g id="text_22">
    <text style="fill: #18313f; font: 13px 'DejaVu Sans'; text-anchor: start" x="560.2464" y="591.756049" transform="rotate(-0 560.2464 591.756049)">Preflight and starting-model scoring</text>
   </g>
   <g id="text_23">
    <text style="fill: #18313f; font: 13px 'DejaVu Sans'; text-anchor: start" x="560.2464" y="625.957489" transform="rotate(-0 560.2464 625.957489)">Counted separately from method CPU</text>
   </g>
   <g id="text_24">
    <text style="fill: #18313f; font: 13px 'DejaVu Sans'; text-anchor: start" x="560.2464" y="660.158929" transform="rotate(-0 560.2464 660.158929)">CASP15 MolProbity was skipped</text>
   </g>
  </g>
  <g id="text_25">
   <text style="fill: #18313f; font: 700 25px 'DejaVu Sans'; text-anchor: start" x="55.44" y="56.796094" transform="rotate(-0 55.44 56.796094)">What each cost number counts</text>
  </g>
  <g id="text_26">
   <text style="fill: #5e6d77; font: 13px 'DejaVu Sans'; text-anchor: start" x="55.44" y="95.305969" transform="rotate(-0 55.44 95.305969)">Discovery, resource building, a modeling run and evaluation have separate ledgers.</text>
  </g>
  <g id="text_27">
   <text style="fill: #5e6d77; font: 12.5px 'DejaVu Sans'; text-anchor: start" x="55.44" y="731.808" transform="rotate(-0 55.44 731.808)">Logical work is not seconds. CASP15 retains 156.18 s of earlier repair attempts separately.</text>
  </g>
