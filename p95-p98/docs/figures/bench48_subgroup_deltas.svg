  <g id="text_38">
   <text style="fill: #5e6d77; font: 13px 'DejaVu Sans'; text-anchor: start" x="63.36" y="552.4992" transform="rotate(-0 63.36 552.4992)">Frozen raw RMSD: W/S uses backbone atoms; hard uses CA atoms. Local regions are expanded W/S regions and hard loop unions.</text>
  </g>
  <g id="text_39">
   <text style="fill: #5e6d77; font: 13px 'DejaVu Sans'; text-anchor: start" x="63.36" y="574.0416" transform="rotate(-0 63.36 574.0416)">Compare within each group. NGK’s one invalid hard result is excluded (15 of 16 pairs).</text>
  </g>
  <g id="text_40">
   <text style="fill: #5e6d77; font: 13px 'DejaVu Sans'; text-anchor: start" x="63.36" y="595.584" transform="rotate(-0 63.36 595.584)">These are paired means, not the README’s display CA medians, where both programs look better than NGK.</text>
  </g>
