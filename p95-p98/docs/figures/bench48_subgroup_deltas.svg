  <g id="text_36">
   <text style="fill: #5e6d77; font: 14px 'DejaVu Sans'; text-anchor: start" x="63.36" y="73.364213" transform="rotate(-0 63.36 73.364213)">Mean paired change versus NGK · method minus NGK · matched valid results</text>
  </g>
  <g id="text_37">
   <text style="fill: #18313f; font: 14px 'DejaVu Sans'; text-anchor: start" x="172.8" y="508.7808" transform="rotate(-0 172.8 508.7808)">Left of zero = closer to the experimental structure than NGK.</text>
