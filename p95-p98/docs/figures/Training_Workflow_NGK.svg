.edge {fill:none;stroke:#000;stroke-width:1.55;stroke-linejoin:round;stroke-linecap:round;}
.guide {fill:none;stroke:#000;stroke-width:1.05;stroke-dasharray:2 5;}
.frame {fill:none;stroke:#000;stroke-width:1.05;}
</style>
