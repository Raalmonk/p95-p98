<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1150" viewBox="0 0 1760 1150" role="img" aria-labelledby="title desc">
<title id="title">Policy evolution with the NGK refinement loop expanded</title>
<desc id="desc">A black-and-white, three-panel method diagram. Panel a shows OpenEvolve choosing existing policies, LLM code revision, evaluation on TRAIN48, Pareto selection, and the two selected programs P95 and P98. Panel b expands one training task: source-only observations enter a fixed policy that chooses ProMod3 database retrieval, NGK, minimization or delivery; candidate state, history and remaining work return to that policy. Panel c expands the NGK refinement loop into native initialization, a policy stop check, loop selection, torsion sampling, KIC closure, side-chain trials or scheduled repacking, minimization and energy evaluation, Monte Carlo acceptance or rejection, and state/history update. Failed closure returns to sampling schematically. The native annealing schedule feeds a policy-controlled per-acceptance temperature multiplier; the multiplier and stopping rule, not the underlying KIC solver or base schedule, are evolved. P95 and P98 use native acceptance or a conditional 0.75 multiplier; neither uses custom inner saves or restores. NGK returns its native low-energy state. This is a schematic of method and control boundaries, not an exact trace of every native nested operation or an assertion about branch frequencies.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#000"/></marker></defs>
