   <g id="text_8">
    <!-- RMSD = $\sqrt{\mathrm{mean}(d_i^2)}$ -->
    <g style="fill: #18313f" transform="translate(550.872 363.096)">
     <text>
      <tspan style="font: 20px 'DejaVu Sans'" x="0 13.896484 31.152344 43.847656 59.248047 65.605469 82.363281 108.264816 127.747238 140.051926 152.307785 164.983566 196.426131" y="-0.7218750000000007 -0.7218750000000007 -0.7218750000000007 -0.7218750000000007 -0.7218750000000007 -0.7218750000000007 -0.7218750000000007 -0.6859375000000014 -0.6859375000000014 -0.6859375000000014 -0.6859375000000014 -0.6859375000000014 -0.6859375000000014">RMSD = mean()</tspan>
      <tspan style="font: 16.119239px 'STIXSizeOneSym'" x="88.720703" y="0.02812499999999929">√</tspan>
      <tspan style="font: oblique 20px 'DejaVu Sans'" x="172.786301" y="-0.6859375000000014">d</tspan>
      <tspan style="font: 14px 'DejaVu Sans'" x="186.97203" y="-8.359375">2</tspan>
      <tspan style="font: oblique 14px 'DejaVu Sans'" x="185.481613" y="4.782812499999999">i</tspan>
     </text>
     <rect x="105.764816" y="-24.5" width="100.964049" height="1.25"/>
    </g>
   </g>
   <g id="text_9">
    <text style="fill: #5e6d77; font: 12px 'DejaVu Sans'; text-anchor: start" x="550.872" y="395.658" transform="rotate(-0 550.872 395.658)">Distances after alignment, in Å. Lower is closer.</text>
   </g>
