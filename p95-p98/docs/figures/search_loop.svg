    <text style="fill: #18313f; font: 700 25px 'DejaVu Sans'; text-anchor: start" x="43.2" y="53.556094" transform="rotate(-0 43.2 53.556094)">OpenEvolve search loop</text>
   </g>
   <g id="text_2">
    <text style="fill: #5e6d77; font: 14px 'DejaVu Sans'; text-anchor: start" x="43.2" y="84.797812" transform="rotate(-0 43.2 84.797812)">How the programs were found, then deployed</text>
   </g>
   <g id="text_3">
    <text style="fill: #936d32; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="59.04" y="146.677969" transform="rotate(-0 59.04 146.677969)">PEOPLE</text>
   </g>
   <g id="text_4">
    <text style="fill: #18313f; font: 700 16px 'DejaVu Sans'; text-anchor: start" x="59.04" y="177.7575" transform="rotate(-0 59.04 177.7575)">Set the rules</text>
   </g>
   <g id="text_5">
    <text style="fill: #18313f; font: 13px 'DejaVu Sans'" transform="translate(59.04 207.157969)">Editable decide(view)</text>
    <text style="fill: #18313f; font: 13px 'DejaVu Sans'" transform="translate(59.04 223.690719)">Allowed observations</text>
    <text style="fill: #18313f; font: 13px 'DejaVu Sans'" transform="translate(59.04 240.223469)">Five objectives + budgets</text>
   </g>
   <g id="text_6">
    <text style="fill: #096daa; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="336.24" y="146.677969" transform="rotate(-0 336.24 146.677969)">LLM</text>
   </g>
   <g id="text_7">
    <text style="fill: #18313f; font: 700 16px 'DejaVu Sans'; text-anchor: start" x="336.24" y="177.7575" transform="rotate(-0 336.24 177.7575)">Propose a code edit</text>
   </g>
   <g id="text_8">
    <text style="fill: #18313f; font: 13px 'DejaVu Sans'" transform="translate(336.24 207.157969)">Parent + peer programs</text>
    <text style="fill: #18313f; font: 13px 'DejaVu Sans'" transform="translate(336.24 223.690719)">Feedback scores</text>
   </g>
   <g id="text_9">
    <text style="fill: #78838a; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="613.44" y="146.677969" transform="rotate(-0 613.44 146.677969)">HOST SOFTWARE</text>
   </g>
   <g id="text_10">
    <text style="fill: #18313f; font: 700 16px 'DejaVu Sans'; text-anchor: start" x="613.44" y="177.7575" transform="rotate(-0 613.44 177.7575)">Apply and check</text>
   </g>
   <g id="text_11">
    <text style="fill: #18313f; font: 13px 'DejaVu Sans'" transform="translate(613.44 207.157969)">Apply the patch</text>
    <text style="fill: #18313f; font: 13px 'DejaVu Sans'" transform="translate(613.44 223.690719)">Static + interface checks</text>
   </g>
   <g id="text_12">
    <text style="fill: #78838a; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="890.64" y="146.677969" transform="rotate(-0 890.64 146.677969)">HOST SOFTWARE</text>
   </g>
   <g id="text_13">
    <text style="fill: #18313f; font: 700 16px 'DejaVu Sans'; text-anchor: start" x="890.64" y="177.7575" transform="rotate(-0 890.64 177.7575)">Run real modeling</text>
   </g>
   <g id="text_14">
    <text style="fill: #18313f; font: 13px 'DejaVu Sans'" transform="translate(890.64 207.157969)">Rosetta NGK / ProMod3</text>
    <text style="fill: #18313f; font: 13px 'DejaVu Sans'" transform="translate(890.64 223.690719)">48 BENCH48 inputs</text>
   </g>
   <g id="text_15">
    <text style="fill: #78838a; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="613.44" y="366.277969" transform="rotate(-0 613.44 366.277969)">HOST SOFTWARE</text>
   </g>
   <g id="text_16">
    <text style="fill: #18313f; font: 700 16px 'DejaVu Sans'; text-anchor: start" x="613.44" y="397.3575" transform="rotate(-0 613.44 397.3575)">Score results and update the archive</text>
   </g>
   <g id="text_17">
    <text style="fill: #18313f; font: 13px 'DejaVu Sans'; text-anchor: start" x="613.44" y="426.757969" transform="rotate(-0 613.44 426.757969)">Five objectives → feedback for the next proposal</text>
   </g>
   <g id="text_18">
    <text style="fill: #096daa; font: 13px 'DejaVu Sans'; text-anchor: start" x="447.84" y="332.437969" transform="rotate(-0 447.84 332.437969)">Feedback</text>
   </g>
   <g id="text_19">
    <text style="fill: #18313f; font: 700 17px 'DejaVu Sans'; text-anchor: start" x="43.2" y="361.397344" transform="rotate(-0 43.2 361.397344)">About 100 proposals</text>
   </g>
   <g id="text_20">
    <text style="fill: #5e6d77; font: 13px 'DejaVu Sans'; text-anchor: start" x="43.2" y="390.037969" transform="rotate(-0 43.2 390.037969)">At most two at a time; wave by wave</text>
   </g>
   <g id="text_21">
    <text style="fill: #18313f; font: 13px 'DejaVu Sans'; text-anchor: start" x="43.2" y="438.277969" transform="rotate(-0 43.2 438.277969)">101 starts → 100 returned → 99 evaluated</text>
   </g>
   <g id="text_22">
    <text style="fill: #5e6d77; font: 700 13px 'DejaVu Sans'; text-anchor: end" x="1107.36" y="514.597969" transform="rotate(-0 1107.36 514.597969)">DISCOVERY</text>
   </g>
   <g id="text_23">
    <text style="fill: #5e6d77; font: 700 13px 'DejaVu Sans'; text-anchor: end" x="1107.36" y="546.277969" transform="rotate(-0 1107.36 546.277969)">DEPLOYMENT</text>
   </g>
   <g id="text_24">
    <text style="fill: #096daa; font: 700 14px 'DejaVu Sans'; text-anchor: start" x="56.16" y="584.477813" transform="rotate(-0 56.16 584.477813)">1  Pick P95 and P98</text>
   </g>
   <g id="text_25">
    <text style="fill: #18313f; font: 13px 'DejaVu Sans'; text-anchor: start" x="56.16" y="616.117969" transform="rotate(-0 56.16 616.117969)">From the search archive</text>
   </g>
   <g id="text_26">
