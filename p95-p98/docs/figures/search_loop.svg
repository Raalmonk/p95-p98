   </g>
   <g id="text_27">
    <text style="fill: #18313f; font: 13px 'DejaVu Sans'; text-anchor: start" x="333.36" y="616.117969" transform="rotate(-0 333.36 616.117969)">Keep the selected code fixed</text>
   </g>
   <g id="text_28">
    <text style="fill: #096daa; font: 700 14px 'DejaVu Sans'; text-anchor: start" x="610.56" y="584.477813" transform="rotate(-0 610.56 584.477813)">3  Test on new proteins</text>
   </g>
